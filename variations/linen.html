<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>thingboard · Linen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Spline+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* Hallmark · variation: Linen · genre: editorial-warm
     * paper: warm-light · display: serif (Fraunces) · accent: terracotta
     * pre-emit critique: P5 H4 E4 S4 R5 V5
     */
    :root {
      --paper: oklch(96.5% 0.013 84);
      --card: oklch(99% 0.009 90);
      --ink: oklch(29% 0.022 64);
      --ink-soft: oklch(48% 0.02 64);
      --ink-faint: oklch(64% 0.02 64);
      --line: oklch(87% 0.018 78);
      --accent: oklch(60% 0.16 41);
      --accent-ink: oklch(99% 0.01 90);
      --grid: oklch(78% 0.02 78 / 0.5);

      --shadow-rest: 0 1px 2px rgba(74, 52, 28, 0.05), 0 10px 22px -10px rgba(74, 52, 28, 0.18);
      --shadow-lift: 0 2px 6px rgba(74, 52, 28, 0.08), 0 18px 34px -12px rgba(74, 52, 28, 0.26);

      --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --font-body: 'Spline Sans', system-ui, -apple-system, sans-serif;

      --r-card: 12px;
      --dur: 160ms;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);

      --tint-butter: oklch(96% 0.066 95);
      --tint-blush: oklch(95% 0.045 24);
      --tint-sage: oklch(94.5% 0.045 152);
      --tint-sky: oklch(95% 0.043 238);
      --tint-lilac: oklch(94.5% 0.045 305);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(var(--grid) 1.3px, transparent 1.3px);
      background-size: 26px 26px;
      overflow: hidden;
    }

    .hdr {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 50;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.15rem;
      backdrop-filter: blur(6px);
      background: linear-gradient(var(--paper), oklch(96.5% 0.013 84 / 0));
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .logo {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.45rem;
      letter-spacing: -0.01em;
    }

    .count {
      font-variant-numeric: tabular-nums;
      color: var(--ink-faint);
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      gap: 0.4rem;
    }

    .btn {
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.34rem 0.7rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out), border-color var(--dur);
    }

    .btn:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-rest);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .board {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .things {
      position: absolute;
      inset: 0;
    }

    .thing {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: max-content;
      will-change: transform;
    }

    .handle {
      height: 22px;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: var(--r-card) var(--r-card) 0 0;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .handle:hover {
      background: color-mix(in oklab, var(--card), var(--accent) 7%);
    }

    .handle:active {
      cursor: grabbing;
    }

    .handle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .grip {
      width: 30px;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
    }

    .coord {
      display: none;
    }

    .thing.dragging .ta {
      box-shadow: var(--shadow-lift);
    }

    .ta {
      display: block;
      font-family: var(--font-body);
      font-size: 0.96rem;
      line-height: 1.55;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 var(--r-card) var(--r-card);
      box-shadow: var(--shadow-rest);
      padding: 0.7rem 0.85rem;
      width: 280px;
      height: 180px;
      min-width: 168px;
      min-height: 92px;
      resize: both;
      outline: none;
      transition: box-shadow var(--dur) var(--ease-out);
    }

    .ta::placeholder {
      color: var(--ink-faint);
      font-style: italic;
    }

    .ta:focus {
      box-shadow: var(--shadow-lift);
    }

    .thing:focus-within {
      z-index: 999;
    }

    .tools {
      position: absolute;
      top: -2.35rem;
      left: 0;
      display: flex;
      gap: 0.35rem;
      padding: 0.25rem;
      border-radius: 9px;
      background: color-mix(in oklab, var(--paper), white 35%);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-rest);
      opacity: 0;
      transform: translateY(4px);
      pointer-events: none;
      transition: opacity var(--dur) var(--ease-out), transform var(--dur) var(--ease-out);
    }

    .thing:hover .tools,
    .thing:focus-within .tools {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .tool {
      font-size: 0.74rem;
      padding: 0.22rem 0.5rem;
    }

    .swatch {
      width: 1rem;
      height: 1rem;
      padding: 0;
      border-radius: 50%;
      background: var(--card);
    }

    .fab {
      position: fixed;
      right: 1.4rem;
      bottom: 1.4rem;
      z-index: 60;
      width: 3.1rem;
      height: 3.1rem;
      border-radius: 50%;
      border: 1px solid color-mix(in oklab, var(--accent), black 8%);
      background: var(--accent);
      color: var(--accent-ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-lift);
      transition: transform var(--dur) var(--ease-out);
    }

    .fab:hover {
      transform: translateY(-2px) scale(1.03);
    }

    .fab:active {
      transform: translateY(1px);
    }

    .fab:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .fab svg {
      width: 1.4rem;
      height: 1.4rem;
    }

    .slate {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      max-width: 22rem;
      text-align: center;
      color: var(--ink-soft);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .slate b {
      font-family: var(--font-display);
      color: var(--ink);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.4rem;
      transform: translate(-50%, 1rem);
      z-index: 70;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      background: var(--ink);
      color: var(--card);
      box-shadow: var(--shadow-lift);
      opacity: 0;
      pointer-events: none;
      font-size: 0.88rem;
      transition: opacity var(--dur) var(--ease-out), transform var(--dur) var(--ease-out);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }

    .toast-btn {
      font: inherit;
      font-weight: 600;
      color: var(--accent);
      background: none;
      border: 0;
      cursor: pointer;
      padding: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body data-tints="butter,blush,sage,sky,lilac">
  <header class="hdr">
    <div class="brand">
      <span class="logo">thingboard</span>
      <span class="count" id="count">0</span>
    </div>
    <nav class="actions">
      <a class="btn" href="https://github.com/thesephist/thingboard" target="_blank" rel="noopener">about</a>
      <button class="btn" id="clear">clear</button>
      <button class="btn" id="stack">stack</button>
    </nav>
  </header>

  <main class="board" id="board">
    <div class="things" id="things"></div>
    <p class="slate" id="slate">
      Click <b>+</b> to add a card. Drag the grip to move — or focus a card and nudge it with the <b>arrow keys</b>.
    </p>
  </main>

  <button class="fab" id="fab" aria-label="Add a card" title="Add a card">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
    </svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const KEY = 'thingboard:linen';
      const SAMPLES = [
        { value: 'Today\n\n— ship the contrast fix\n— call the framing shop\n— water the basil', x: 90, y: 120, w: 280, h: 210, tint: 'butter' },
        { value: 'Ideas\n\nwhat if the board had a faint paper grain? warm, not loud.', x: 430, y: 150, w: 300, h: 170, tint: 'sage' },
        { value: 'Quote\n\n“Simplicity is the ultimate sophistication.”', x: 250, y: 380, w: 320, h: 150, tint: 'blush' },
      ];

      const things = document.getElementById('things');
      const countEl = document.getElementById('count');
      const slate = document.getElementById('slate');
      const toastEl = document.getElementById('toast');
      const tints = (document.body.dataset.tints || '').split(',').filter(Boolean);

      let cards = [];
      let z = 10;
      const els = new Map();

      const uid = () => Math.random().toString(36).slice(2, 9);
      const debounce = (fn, d = 350) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), d); }; };
      const persist = debounce(() => { try { localStorage.setItem(KEY, JSON.stringify(cards)); } catch (e) { } });

      function toast(msg, label, onAction) {
        toastEl.innerHTML = '';
        const span = document.createElement('span');
        span.textContent = msg;
        toastEl.appendChild(span);
        if (label) {
          const b = document.createElement('button');
          b.className = 'toast-btn';
          b.textContent = label;
          b.addEventListener('click', () => { onAction && onAction(); hide(); });
          toastEl.appendChild(b);
        }
        toastEl.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(hide, 6000);
        function hide() { toastEl.classList.remove('show'); }
      }

      function refreshMeta() {
        countEl.textContent = cards.length;
        slate.hidden = cards.length > 0;
      }

      function raise(el) { el.style.zIndex = ++z; }

      function makeEl(card) {
        const el = document.createElement('article');
        el.className = 'thing' + (card.tint ? ' tint-' + card.tint : '');
        if (card.tint) el.style.setProperty('--card', getComputedStyle(document.documentElement).getPropertyValue('--tint-' + card.tint));
        el.dataset.id = card.id;
        el.style.zIndex = ++z;

        el.innerHTML =
          '<div class="handle" tabindex="0" role="button" aria-label="Move card. Arrow keys nudge, Shift for fine.">' +
          '<span class="grip" aria-hidden="true"></span><span class="coord" aria-hidden="true"></span></div>' +
          '<div class="tools">' +
          '<button class="btn tool" data-act="clone">clone</button>' +
          '<button class="btn tool" data-act="delete">delete</button>' +
          '<button class="btn tool" data-act="reset">reset</button>' +
          (tints.length ? '<button class="btn tool swatch" data-act="tint" aria-label="Change card colour"></button>' : '') +
          '</div>' +
          '<textarea class="ta" placeholder="say something…" spellcheck="false"></textarea>';

        const ta = el.querySelector('.ta');
        const handle = el.querySelector('.handle');
        const coord = el.querySelector('.coord');
        ta.value = card.value || '';
        ta.style.width = (card.w || 280) + 'px';
        ta.style.height = (card.h || 180) + 'px';

        function place() {
          el.style.transform = 'translate(' + card.x + 'px,' + card.y + 'px)';
          if (coord) coord.textContent = Math.round(card.x) + ', ' + Math.round(card.y);
        }
        place();

        el.addEventListener('pointerdown', () => raise(el), true);
        ta.addEventListener('input', () => { card.value = ta.value; persist(); });

        const ro = new ResizeObserver(() => {
          const w = ta.offsetWidth, h = ta.offsetHeight;
          if (w && h && (w !== card.w || h !== card.h)) { card.w = w; card.h = h; persist(); }
        });
        ro.observe(ta);

        let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
        handle.addEventListener('pointerdown', e => {
          dragging = true; handle.setPointerCapture(e.pointerId);
          sx = e.clientX; sy = e.clientY; ox = card.x; oy = card.y;
          raise(el); el.classList.add('dragging');
        });
        handle.addEventListener('pointermove', e => {
          if (!dragging) return;
          card.x = ox + (e.clientX - sx);
          card.y = oy + (e.clientY - sy);
          place();
        });
        const end = () => { if (!dragging) return; dragging = false; el.classList.remove('dragging'); persist(); };
        handle.addEventListener('pointerup', end);
        handle.addEventListener('pointercancel', end);

        handle.addEventListener('keydown', e => {
          const step = e.shiftKey ? 1 : 12;
          let moved = true;
          if (e.key === 'ArrowUp') card.y -= step;
          else if (e.key === 'ArrowDown') card.y += step;
          else if (e.key === 'ArrowLeft') card.x -= step;
          else if (e.key === 'ArrowRight') card.x += step;
          else moved = false;
          if (moved) { e.preventDefault(); place(); persist(); }
        });

        el.querySelector('.tools').addEventListener('click', e => {
          const hit = e.target.closest('[data-act]');
          if (!hit) return;
          const act = hit.dataset.act;
          if (act === 'delete') removeCard(card.id);
          else if (act === 'clone') addCard({ value: card.value, x: card.x + 18, y: card.y + 18, w: card.w, h: card.h, tint: card.tint });
          else if (act === 'reset') { card.w = 280; card.h = 180; ta.style.width = '280px'; ta.style.height = '180px'; persist(); }
          else if (act === 'tint' && tints.length) {
            const i = tints.indexOf(card.tint);
            card.tint = tints[(i + 1) % tints.length];
            el.className = 'thing tint-' + card.tint;
            el.style.setProperty('--card', getComputedStyle(document.documentElement).getPropertyValue('--tint-' + card.tint));
            persist();
          }
        });

        return el;
      }

      function addCard(partial) {
        const tint = tints.length ? tints[cards.length % tints.length] : undefined;
        const card = Object.assign({ id: uid(), value: '', x: 60, y: 100, w: 280, h: 180, tint }, partial);
        cards.push(card);
        const el = makeEl(card);
        els.set(card.id, el);
        things.appendChild(el);
        refreshMeta();
        persist();
        if (!card.value) el.querySelector('.ta').focus();
        return card;
      }

      function removeCard(id) {
        const el = els.get(id);
        if (el) { el.remove(); els.delete(id); }
        cards = cards.filter(c => c.id !== id);
        refreshMeta();
        persist();
      }

      function render() {
        things.innerHTML = '';
        els.clear();
        for (const card of cards) {
          if (!card.id) card.id = uid();
          const el = makeEl(card);
          els.set(card.id, el);
          things.appendChild(el);
        }
        refreshMeta();
      }

      document.getElementById('fab').addEventListener('click', () => {
        addCard({ x: Math.max(20, window.innerWidth / 2 - 140), y: Math.max(90, window.innerHeight / 2 - 100) });
      });

      document.getElementById('clear').addEventListener('click', () => {
        if (!cards.length) return;
        const backup = cards.slice();
        cards = [];
        render();
        persist();
        toast('Cleared ' + backup.length + ' card' + (backup.length === 1 ? '' : 's') + '.', 'Undo', () => {
          cards = backup; render(); persist();
        });
      });

      document.getElementById('stack').addEventListener('click', () => {
        let i = 0;
        for (const c of cards) {
          i++;
          c.x = i * 16;
          c.y = 76 + i * 16;
          const el = els.get(c.id);
          el.style.transform = 'translate(' + c.x + 'px,' + c.y + 'px)';
          raise(el);
        }
        persist();
      });

      function load() {
        try { const raw = localStorage.getItem(KEY); if (raw) cards = JSON.parse(raw); } catch (e) { cards = []; }
        if (!cards.length) cards = SAMPLES.map(s => Object.assign({ id: uid() }, s));
      }

      load();
      render();
    })();
  </script>
</body>

</html>
